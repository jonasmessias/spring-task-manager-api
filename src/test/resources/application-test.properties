# ============================================
# Test Profile Configuration
# ============================================

spring.application.name=task-manager-api-test

# H2 In-Memory Database (replaces PostgreSQL for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (H2 uses ddl-auto)
spring.flyway.enabled=false

# Disable Redis for tests
spring.data.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration

# JWT Secret (test only)
api.security.token.secret=test-secret-key-for-unit-testing-purposes-only-1234567890

# Frontend URL (test)
app.frontend.url=http://localhost:4200
app.frontend.prod-url=http://localhost:4200

# AWS SES (disabled - mocked in tests)
aws.ses.region=us-east-1
aws.ses.access-key=test-key
aws.ses.secret-key=test-secret
aws.ses.from-email=test@test.com

# AWS S3 (disabled - mocked in tests)
aws.s3.region=us-east-1
aws.s3.access-key=test-key
aws.s3.secret-key=test-secret
aws.s3.bucket-name=test-bucket

# Google OAuth (disabled - mocked in tests)
google.client.id=test-google-client-id

# Logging
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

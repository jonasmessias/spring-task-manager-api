# ==============================================================================
# Task Manager API - Configuration Template
# ==============================================================================
# Copy this file to application.properties and fill in your values.
# NEVER commit application.properties to the repository.
# ==============================================================================

spring.application.name=task-manager-api

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.springframework.security=DEBUG

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# Redis (Refresh Token Caching)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# JWT Secret (generate a strong random key for production)
api.security.token.secret=CHANGE_ME_TO_A_STRONG_RANDOM_KEY

# Frontend URLs (dev + production)
app.frontend.url=http://localhost:4200
app.frontend.prod-url=https://your-frontend-domain.com

# AWS SES (Email)
aws.ses.region=us-east-1
aws.ses.access-key=YOUR_AWS_ACCESS_KEY
aws.ses.secret-key=YOUR_AWS_SECRET_KEY
aws.ses.from=your-verified-email@example.com

# AWS S3 (File Storage)
aws.s3.region=us-east-1
aws.s3.access-key=YOUR_AWS_ACCESS_KEY
aws.s3.secret-key=YOUR_AWS_SECRET_KEY
aws.s3.bucket-name=your-bucket-name

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth2
google.client-id=YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com

# Thymeleaf (used only for email templates, not web views)
spring.thymeleaf.check-template-location=false

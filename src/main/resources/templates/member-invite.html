<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You've been invited!</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f7;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f7"
    >
      <tr>
        <td align="center" style="padding: 40px 0">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background-color: #059669;
                  padding: 32px 40px;
                  text-align: center;
                "
              >
                <h1
                  style="
                    color: #ffffff;
                    margin: 0;
                    font-size: 24px;
                    font-weight: 600;
                  "
                >
                  Task Manager
                </h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 40px">
                <h2 style="margin: 0 0 16px; color: #1a1a2e; font-size: 20px">
                  You've been invited! 🎉
                </h2>
                <p style="color: #4a4a68; line-height: 1.6; margin: 0 0 8px">
                  Hi there!
                </p>
                <p style="color: #4a4a68; line-height: 1.6; margin: 0 0 24px">
                  <strong th:text="${inviterName}">Someone</strong> has invited
                  you to join
                  <strong th:text="${resourceType}">workspace</strong>
                  "<strong th:text="${resourceName}">My Project</strong>" as
                  <strong th:text="${role}">member</strong>.
                </p>

                <!-- CTA Button -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin: 0 auto"
                >
                  <tr>
                    <td
                      align="center"
                      style="border-radius: 6px; background-color: #059669"
                    >
                      <a
                        th:href="${acceptLink}"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 14px 32px;
                          color: #ffffff;
                          text-decoration: none;
                          font-size: 16px;
                          font-weight: 600;
                        "
                      >
                        Open Task Manager
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    color: #8888a0;
                    font-size: 13px;
                    line-height: 1.5;
                    margin: 24px 0 0;
                  "
                >
                  If you don't have an account yet, you'll be able to create one
                  after clicking the link.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  background-color: #f9f9fb;
                  padding: 20px 40px;
                  text-align: center;
                  border-top: 1px solid #ededf0;
                "
              >
                <p style="color: #a0a0b8; font-size: 12px; margin: 0">
                  © 2025 Task Manager. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

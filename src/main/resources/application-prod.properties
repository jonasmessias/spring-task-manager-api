# ==============================================================================
# Task Manager API - PRODUCTION Configuration
# ==============================================================================
# All sensitive values come from environment variables.
# This file is safe to commit to the repository.
# ==============================================================================

spring.application.name=task-manager-api

# ── Database (AWS RDS PostgreSQL) ────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# IMPORTANT: 'validate' in production — never auto-modify the schema
spring.jpa.hibernate.ddl-auto=validate

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ── Redis (AWS ElastiCache) ──────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000

# ── JWT ──────────────────────────────────────────────────────────────
api.security.token.secret=${JWT_SECRET}

# ── Frontend URLs ────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:https://task-manager-app-angular.vercel.app}
app.frontend.prod-url=${FRONTEND_URL:https://task-manager-app-angular.vercel.app}

# ── AWS SES (Email) ─────────────────────────────────────────────────
aws.ses.region=${AWS_REGION:sa-east-1}
aws.ses.access-key=${AWS_ACCESS_KEY}
aws.ses.secret-key=${AWS_SECRET_KEY}
aws.ses.from=${AWS_SES_FROM:noreply@jonasmessias.dev.br}

# ── AWS S3 (File Storage) ───────────────────────────────────────────
aws.s3.region=${AWS_REGION:sa-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.bucket-name=${S3_BUCKET_NAME:task-manager-storage-jonas}

# ── Google OAuth2 ───────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID}

# ── Logging (production) ────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.com.example.taskmanagerapi=INFO

# ── Swagger (disabled in production) ────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Upload limits ───────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Thymeleaf ───────────────────────────────────────────────────────
spring.thymeleaf.check-template-location=false

# ── Flyway ──────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── Actuator ────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Server ──────────────────────────────────────────────────────────
server.port=8080

# ==============================================================================
# Docker Compose - PRODUCTION (EC2)
# ==============================================================================
# Runs Spring Boot API + Redis on the same EC2 instance.
# PostgreSQL → AWS RDS (managed)
# Redis      → Local container (lightweight, ~10MB RAM)
# ==============================================================================
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# Required environment variables (set in EC2 or .env file):
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD,
#   JWT_SECRET, AWS_ACCESS_KEY, AWS_SECRET_KEY,
#   GOOGLE_CLIENT_ID, FRONTEND_URL
# ==============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - taskmanager-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-api
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-sa-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-task-manager-storage-jonas}
      AWS_SES_FROM: ${AWS_SES_FROM:-noreply@jonasmessias.dev.br}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-https://task-manager-app-angular.vercel.app}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taskmanager-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:

networks:
  taskmanager-network:
    driver: bridge
